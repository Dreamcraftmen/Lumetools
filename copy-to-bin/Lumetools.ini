; ===========================================================================
;  Lumetools v1.0.0 - configuration
; ===========================================================================
;  Edit, save, relaunch. Do not use a rich-text editor (Word / WPS).
;
;  !! This file ships with the package, so copying the package over your
;  !! bin/ WILL replace it. If you already tuned your own Lumetools.ini,
;  !! back it up first and restore it after.
; ===========================================================================


; ---------------------------------------------------------------------------
; [vfs] data directories
; ---------------------------------------------------------------------------
; Relative to the bin directory. Switch to absolute paths if the game
; cannot read them, e.g. amfs=C:\SDHD\bin\amfs
[vfs]
amfs=amfs
option=option
appdata=appdata


; ---------------------------------------------------------------------------
; [dns] server
; ---------------------------------------------------------------------------
; default   The one you normally need. Server address, WITHOUT http:// or
;           https://. 127.0.0.1 / localhost are rejected.
;
; The rest are optional and fall back to default. Only set them if your
; server operator explicitly asks for a split configuration:
;   router   location router
;   startup  startup / authentication
;   billing  billing
;   aimedb   Aime card database
;
; replaceHost  Rewrites the HTTP Host header. Enable ONLY if your server
;              operator tells you to; otherwise it breaks the connection.
[dns]
default=
;router=
;startup=
;billing=
;aimedb=
;replaceHost=


; ---------------------------------------------------------------------------
; [netenv] simulated LAN
; ---------------------------------------------------------------------------
; enable=1 presents a virtual 192.168.139.x adapter. CHUNITHM is picky about
; its LAN environment; keep this at 1 for single-cabinet play.
; If you disable it, subnet MUST match your real LAN and start with 192.168.
[netenv]
enable=1
;addrSuffix=11
;routerSuffix=254
;macAddr=01:02:03:04:05:06


; ---------------------------------------------------------------------------
; [keychip] cabinet identity
; ---------------------------------------------------------------------------
; id   The machine serial from your server panel.
;      Format: A\d{2}(E|X)-(01|20)[ABCDU]\d{8}   e.g. AXXE-01A########
;
; subnet   Virtual LAN subnet. Keep the default when netenv=1.
;          When netenv=0 this must be your real subnet (must start with 192.168).
;
; The entries below are only needed by specific servers. Usually leave them blank:
;   gameId / platformId / region / systemFlag
;   pcbid      baseboard serial, default ACAE01A99999999
;   serialNo
[keychip]
id=
subnet=192.168.139.0
;gameId=XXXX
;platformId=
;region=
;systemFlag=
;pcbid=ACAE01A99999999
;serialNo=


; ---------------------------------------------------------------------------
; [gpio] cabinet type (dipsw)
; ---------------------------------------------------------------------------
; !! THESE THREE MUST MATCH YOUR CABINET !!
; A wrong value here makes the self-check validate the wrong hardware type
; and fail, even though everything else is correct.
;
; dipsw1  0 = client   1 = standard machine (use 1 when there is only one cab)
; dipsw2  0 = 120fps   1 = 60fps     -- must match your monitor
; dipsw3  0 = SP cabinet   1 = CVT cabinet
;
; Common combinations:
;   120 Hz + SP   -> dipsw2=0 dipsw3=0
;    60 Hz + CVT  -> dipsw2=1 dipsw3=1
[gpio]
dipsw1=1
dipsw2=0
dipsw3=0


; ---------------------------------------------------------------------------
; [gfx] display
; ---------------------------------------------------------------------------
; windowed  0 = fullscreen   1 = window (recommended; safer if it hangs)
; framed    1 = window has a border
; monitor   which display to use in fullscreen, 0 = primary
[gfx]
windowed=1
framed=1
monitor=0


; ---------------------------------------------------------------------------
; [chuniio] input device -- this is where you switch controllers
; ---------------------------------------------------------------------------
; Keep exactly ONE active. Enabling several at once is the most common cause
; of a crash right after launch when the hardware is not present.
;
;   path=chuniio-mux.dll      mount everything (pad + keyboard at once)
;   path=tasoller.dll         TASOLLER
;   path=tasoller_plus.dll    TASOLLER PLUS
;   path=yubideck.dll         Yubideck
;   path=brokenithm.dll       Brokenithm (tablet as touch panel)
;   path=chuniio.dll          keyboard only
;
; NOTE: with NO path set, the built-in IO's LED backend answers "Get info"
;       during the self-check and the game can quit right there. Keep
;       chuniio-mux.dll active unless you have a specific reason not to.
[chuniio]
path=chuniio-mux.dll
;path=tasoller.dll
;path=tasoller_plus.dll
;path=yubideck.dll
;path=brokenithm.dll
;path=chuniio.dll


; ---------------------------------------------------------------------------
; [aimeio] card reader driver
; ---------------------------------------------------------------------------
; Only for a real serial reader. Leave commented out for a virtual card.
;[aimeio]
;path=aimeio.dll
;path=aimeio_yubideck.dll
;path=aimeio_hinata.dll


; ---------------------------------------------------------------------------
; [aime] virtual card reader
; ---------------------------------------------------------------------------
; 1 = virtual card (keyboard swipe) or a custom aimeio
; 0 = real serial reader
[aime]
enable=1


; ---------------------------------------------------------------------------
; [io3] cabinet service buttons
; ---------------------------------------------------------------------------
; Virtual-key codes in hex (0x..) or decimal.
;   test=0x31 -> "1"   service=0x32 -> "2"   coin=0x33 -> "3"
; ir = AIR sensor, default space
[io3]
test=0x31
service=0x32
coin=0x33
ir=0x20


; ---------------------------------------------------------------------------
; [ir] six IR receivers (only with dedicated AIR hardware)
; ---------------------------------------------------------------------------
; With enable=1, set ir=0 in [io3]
;[ir]
;enable=1
;ir1=0x34
;ir2=0x35
;ir3=0x36
;ir4=0x37
;ir5=0x38
;ir6=0x39


; ---------------------------------------------------------------------------
; [slider] 32 touch cells (keyboard mapping)
; ---------------------------------------------------------------------------
; Default, left to right:
;   S S S S  D D D D  F F F F  G G G G
;   H H H H  J J J J  K K K K  L L L L
; Cells are numbered right to left, matching the service manual.
;
; Only change this for a high-precision slider:
;[slider]
;enable=1
;cell32=0x53
;cell31=0x53
;...


; ---------------------------------------------------------------------------
; [led] LED boards
; ---------------------------------------------------------------------------
; 0 = no LED backend. The self-check shows LED制御ボード ---- and waits for
;     you to skip it (press S). This is the safe value without real LEDs.
;
; 1 = emulate a LED board. On some setups the self-check queries the emulated
;     board (RGB LED xx: Get info) and then quits. Only enable this if you
;     actually need LED output.
[led]
enable=0
